# CI (Phase 17): build-check both apps on every push/PR to main.
# Deployment itself is handled by Vercel (frontend) and Render (backend) via
# their own GitHub integrations, which redeploy on push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Import check
        env:
          GEMINI_API_KEY: dummy-key-for-ci
        run: python -c "import main; print('backend import OK')"
