# Render blueprint (Phase 17) — one-click deploy of the backend container.
# In Render: New → Blueprint → point at this repo. Fill the `sync: false`
# secrets in the dashboard afterwards.
services:
  - type: web
    name: ai-workspace-copilot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBED_DIM
        value: "768"
      # The deployed frontend origin, for CORS (your Vercel URL).
      - key: CORS_ORIGINS
        sync: false
